<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Color Matcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>The Color Matcher</h1>
        <div id="score-board">
            Score: <span id="score">0</span> | Time: <span id="time">30</span>s
        </div>

        <div id="word-display-area">
            <div id="color-word">Click START to play!</div>
        </div>

        <div id="button-area">
            <button id="match-btn" disabled>MATCH</button>
            <button id="mismatch-btn" disabled>MISMATCH</button>
        </div>

        <button id="start-btn">START GAME</button>
        
        <div id="message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
